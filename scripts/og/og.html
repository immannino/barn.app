<!doctype html>
<!-- The link-preview image (site/assets/og.jpg). Render with ./scripts/make-og.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@1&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #17128c; --electric: #334dff; --sky: #8cb3ff; --coral: #ff5c61;
    --butter: #ffd64d; --mint: #3ddb99; --cream: #fff7eb;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; color: #fff; font-family: var(--display);
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(55% 60% at 92% 88%, rgba(255, 92, 97, 0.9), transparent 70%),
      radial-gradient(38% 45% at 4% 100%, rgba(255, 214, 77, 0.55), transparent 70%),
      radial-gradient(50% 60% at 14% 0%, rgba(140, 179, 255, 0.65), transparent 70%),
      linear-gradient(135deg, var(--ink), var(--electric) 55%, #5c7bff);
  }
  .grain {
    position: absolute; inset: 0; opacity: 0.22; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .copy { position: absolute; left: 72px; top: 64px; width: 540px; }
  .wordmark { font-weight: 800; font-size: 34px; letter-spacing: -0.05em; display: inline-flex; align-items: baseline; gap: 3px; }
  .wordmark i { width: 9px; height: 9px; border-radius: 50%; background: var(--butter); display: inline-block; }
  h1 { margin-top: 42px; font-size: 76px; font-weight: 800; line-height: 0.98; letter-spacing: -0.035em; }
  h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--butter); letter-spacing: -0.01em; }
  .lede { margin-top: 22px; font-size: 23px; font-weight: 500; line-height: 1.32; opacity: 0.94; letter-spacing: -0.01em; }
  .cta { position: absolute; left: 72px; bottom: 60px; display: flex; align-items: center; gap: 14px; }
  .button {
    background: var(--cream); color: var(--ink); font-weight: 700; font-size: 21px;
    padding: 14px 26px; border-radius: 999px;
    box-shadow: 0 10px 30px rgba(10, 6, 64, 0.35), inset 0 -3px 0 rgba(23, 18, 140, 0.12);
  }
  .keys { display: flex; gap: 6px; align-items: center; font-weight: 700; font-size: 17px; opacity: 0.95; }
  kbd {
    font: 700 17px var(--display); min-width: 38px; height: 38px; padding: 0 10px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.28);
    box-shadow: inset 0 -2px 0 rgba(10, 6, 64, 0.25);
  }
  .keys span { margin-left: 6px; opacity: 0.85; font-weight: 600; }

  /* The deck: 3×2 glass tiles, like barn's floating deck. */
  .deck {
    position: absolute; right: 64px; top: 50%; transform: translateY(-50%) rotate(2.5deg);
    display: grid; grid-template-columns: repeat(3, 150px); gap: 14px;
    padding: 22px; border-radius: 40px;
    background: rgba(10, 6, 64, 0.18); border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 40px 80px -24px rgba(10, 6, 64, 0.65);
  }
  .tile {
    position: relative; height: 150px; border-radius: 32px; padding: 16px 16px 15px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.24);
    backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 12px 24px -12px rgba(5, 3, 40, 0.6);
  }
  .top { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; }
  .top b { opacity: 0.72; }
  .top time { margin-left: auto; font-weight: 600; opacity: 0.7; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #b9b8c9; }
  .tile strong { display: block; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .tile small { display: block; margin-top: 3px; font-size: 14px; font-weight: 600; opacity: 0.9; }

  .needs { background: rgba(255, 92, 97, 0.34); }
  .needs::after { content: ""; position: absolute; inset: -1px; border-radius: 32px; border: 2.5px solid var(--coral); box-shadow: 0 0 22px rgba(255, 92, 97, 0.7); }
  .needs .dot { background: var(--coral); box-shadow: 0 0 8px var(--coral); }
  .needs small { color: #ffd0d1; }
  .ready { background: rgba(61, 219, 153, 0.5); }
  .ready .dot { background: var(--mint); box-shadow: 0 0 8px var(--mint); }
  .ready small { color: #d8ffee; }
  .working { background: rgba(51, 77, 255, 0.3); }
  .working .dot { background: var(--sky); box-shadow: 0 0 8px var(--sky); }
  .working small { color: var(--sky); }
  /* A frozen frame of the orbit: a comet of light partway around the border. */
  .working::before {
    content: ""; position: absolute; inset: -1px; border-radius: 32px; padding: 3px;
    background: conic-gradient(from var(--at), transparent 0 45%, rgba(170, 200, 255, 0.45) 78%, rgba(220, 232, 255, 1) 97%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    filter: drop-shadow(0 0 8px rgba(170, 200, 255, 0.95));
  }
  .idle small { opacity: 0.6; }
</style>
</head>
<body>
  <div class="grain"></div>

  <div class="copy">
    <div class="wordmark">barn<i></i></div>
    <h1>a little barn for <em>all</em> your agents.</h1>
    <p class="lede">See every AI coding agent at a glance. Jump to the one that needs you in one keystroke.</p>
  </div>

  <div class="cta">
    <div class="button">free for mac · barn.ope.cool</div>
    <div class="keys"><kbd>⌃</kbd><kbd>⌥</kbd><kbd>space</kbd></div>
  </div>

  <div class="deck">
    <div class="tile needs"><div class="top"><span class="dot"></span><b>CC</b><time>2m</time></div>
      <div><strong>pancake-api</strong><small>needs you</small></div></div>
    <div class="tile working" style="--at: 40deg"><div class="top"><span class="dot"></span><b>CX</b><time>&lt;1m</time></div>
      <div><strong>garden</strong><small>thinking</small></div></div>
    <div class="tile ready"><div class="top"><span class="dot"></span><b>MV</b><time>4m</time></div>
      <div><strong>ledger</strong><small>ready</small></div></div>
    <div class="tile working" style="--at: 230deg"><div class="top"><span class="dot"></span><b>GM</b><time>1m</time></div>
      <div><strong>web</strong><small>Edit</small></div></div>
    <div class="tile ready"><div class="top"><span class="dot"></span><b>AM</b><time>9m</time></div>
      <div><strong>search</strong><small>ready</small></div></div>
    <div class="tile idle"><div class="top"><span class="dot"></span><b>CC</b><time>2h</time></div>
      <div><strong>docs</strong><small>idle</small></div></div>
  </div>
</body>
</html>
